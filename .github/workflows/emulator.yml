name: Android emulator RDP integration

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rdp-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-rdp-emulator:
    # Standard public-repository hosted runner, not a paid larger/self-hosted runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            build/freerdp-android
            app/src/main/jniLibs/x86_64
          key: rdp-native-x86_64-${{ runner.os }}-${{ hashFiles('scripts/build-native.sh', 'scripts/build-freerdp-android.sh', 'scripts/patch-freerdp-flow-control.py', 'scripts/build-openssl-android.sh', 'scripts/native-env.sh') }}
          restore-keys: |
            rdp-native-x86_64-${{ runner.os }}-
      - name: Build actual x86_64 RDP libraries and instrumentation
        env:
          ABI: x86_64
          JOBS: '4'
        run: |
          bash scripts/build-native.sh > native-build.log 2>&1
          ./gradlew --no-daemon -PnativeAbis=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/x86_64/librdpsync.so'
      - name: Preserve successful native build independently of runtime tests
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/freerdp-android
            app/src/main/jniLibs/x86_64
          key: rdp-native-x86_64-${{ runner.os }}-${{ hashFiles('scripts/build-native.sh', 'scripts/build-freerdp-android.sh', 'scripts/patch-freerdp-flow-control.py', 'scripts/build-openssl-android.sh', 'scripts/native-env.sh') }}
      - name: Start pinned isolated xrdp desktop and weak-link proxy
        run: |
          RDP_FIXTURE_PURPOSE=android-acceptance bash scripts/fixtures/start-reference-server.sh upstream-0.10.6.1 >build/pinned-server-build.log 2>&1
          bash scripts/fixtures/start-tls-fixture.sh
          nohup python3 -u scripts/fixtures/rdp_network_proxy.py >build/emulator-evidence/network-proxy.log 2>&1 &
          echo $! >build/emulator-evidence/proxy.pid
      - name: Enable KVM for hosted Android virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real remote rendering, input, resize and weak link
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/fixtures/run-emulator-tests.sh
      - name: Collect server and build evidence
        if: always()
        run: |
          mkdir -p build/emulator-evidence
          sudo cp /var/log/xrdp.log /var/log/xrdp-sesman.log build/emulator-evidence/ 2>/dev/null || true
          sudo cp /home/rdpfixture/fixture.log /home/rdpfixture/rdpsync-fixture-state.json build/emulator-evidence/ 2>/dev/null || true
          if id rdpfixture >/dev/null 2>&1; then
            while IFS= read -r xlog; do
              sudo cp "$xlog" "build/emulator-evidence/xorg-${xlog##*/}"
            done < <(sudo find /home/rdpfixture -maxdepth 1 -type f -name '.xorgxrdp.*.log')
          fi
          sudo chown -R "$(id -u):$(id -g)" build/emulator-evidence
          if test -f build/emulator-evidence/tls-fixture.pid; then
            python3 -c 'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8767/state", timeout=2).read().decode())' >build/emulator-evidence/tls-fixture-final-state.json || true
            kill "$(cat build/emulator-evidence/tls-fixture.pid)" || true
          fi
          if test -f build/emulator-evidence/proxy.pid; then kill "$(cat build/emulator-evidence/proxy.pid)" || true; fi
          if test -f build/emulator-evidence/control.pid; then sudo kill "$(cat build/emulator-evidence/control.pid)" || true; fi
          sudo systemctl stop xrdp xrdp-sesman || true
      - name: Upload test reports and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-emulator-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          path: |
            build/emulator-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            native-build.log
            build/freerdp-android/rdpsync-native-provenance-x86_64.json
            build/pinned-server-build.log
