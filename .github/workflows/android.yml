name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/28.0.13004108
      JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache pinned native dependency sources and build intermediates
        uses: actions/cache@v4
        with:
          path: build/freerdp-android
          key: native-arm64-${{ runner.os }}-${{ hashFiles('scripts/native-env.sh', 'scripts/build-openssl-android.sh', 'scripts/build-freerdp-android.sh', 'scripts/patch-freerdp-flow-control.py') }}
          # Reuse only intermediates; the pinned source check and CMake/native build always run.
          restore-keys: |
            native-arm64-${{ runner.os }}-
      - name: Build real FreeRDP/OpenSSL/JNI runtime
        run: bash scripts/build-native.sh
      - name: Native production-source regression tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libssl-dev
          bash scripts/test-native.sh
          python3 scripts/test-native-notices.py
          python3 scripts/collect-native-notices.py --check
          python3 scripts/fixtures/test_collect_android_evidence.py
          python3 scripts/test-ime-setting-readiness.py
          python3 scripts/fixtures/test_record_ime_environment.py
          python3 scripts/fixtures/test_emulator_boot_health.py
          python3 scripts/fixtures/test_network_readiness.py
          python3 scripts/fixtures/test_xrdp_drive_files.py
          python3 scripts/fixtures/test_xrdp_drive_pressure.py
          python3 scripts/test-freerdp-flow-patch.py
          python3 scripts/test-product-ui.py
          python3 scripts/fixtures/test_collect_product_ui.py
      - name: Unit tests, lint, and side-by-side preview APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify JNI exports, dependency closure, signature and 16 KiB alignment
        run: python3 scripts/verify-apk.py app/build/outputs/apk/debug/app-debug.apk | tee build/apk-verification.txt
      - name: Upload installable preview APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: rdpsync-preview-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/apk-verification.txt
            build/freerdp-android/rdpsync-native-provenance-arm64-v8a.json
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdpsync-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/reports
            app/build/test-results
            build/native-tests
