name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/28.0.13004108
      JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache pinned native dependency sources and build intermediates
        uses: actions/cache@v4
        with:
          path: build/freerdp-android
          key: native-arm64-${{ runner.os }}-${{ hashFiles('scripts/native-env.sh', 'scripts/build-openssl-android.sh', 'scripts/build-freerdp-android.sh') }}
      - name: Build real FreeRDP/OpenSSL/JNI runtime
        run: bash scripts/build-native.sh
      - name: Native production-source regression tests
        run: bash scripts/test-native.sh
      - name: Unit tests, lint, and side-by-side preview APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify JNI exports, dependency closure, signature and 16 KiB alignment
        run: python3 scripts/verify-apk.py app/build/outputs/apk/debug/app-debug.apk | tee build/apk-verification.txt
      - name: Upload installable preview APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: rdpsync-preview-arm64-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/apk-verification.txt
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdpsync-reports-${{ github.sha }}
          path: |
            app/build/reports
            app/build/test-results
            build/native-tests
